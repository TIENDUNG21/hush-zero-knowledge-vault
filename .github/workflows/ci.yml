name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (lint, PHPStan, PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, openssl, mbstring
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer stan
      - run: composer test

  js:
    name: JavaScript (ESLint, tsc, node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker image (build, compose up, CLI round trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, openssl
          coverage: none
          tools: composer:v2

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Health, headers and no access log
        run: |
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsSI http://127.0.0.1:8080/ | tr -d '\r' | tee headers.txt
          grep -qi "content-security-policy: default-src 'none'" headers.txt
          grep -qi '^server: apache$' headers.txt
          ! grep -qi 'x-powered-by' headers.txt
          # The image sends logs to stdout; no request line may appear there.
          ! docker compose logs hush | grep -E '"(GET|POST|PUT|DELETE) /'

      - name: bin/hush round trip against the container
        run: |
          composer install --no-dev --no-interaction --no-progress
          link=$(printf 'sent to the container' | php bin/hush send --server http://127.0.0.1:8080)
          test "$(php bin/hush get "$link")" = "sent to the container"
          ! php bin/hush get "$link"
          docker compose exec -T hush php bin/hush-admin stats
          # The server must not log the secret id anywhere.
          id=${link##*/s/}; id=${id%%#*}
          test ${#id} -eq 22
          ! docker compose logs | grep -F "$id"

      - name: Container logs
        if: always()
        run: docker compose logs

      - run: docker compose down -v

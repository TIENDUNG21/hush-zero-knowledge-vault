# docker compose up -d --build   ->  http://127.0.0.1:8080
# Put a TLS-terminating reverse proxy in front for anything beyond localhost
# and set HUSH_PUBLIC_ORIGIN to the public https:// origin.

services:
  hush:
    build: .
    image: hush-zero-knowledge-vault:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HUSH_PUBLIC_ORIGIN: ${HUSH_PUBLIC_ORIGIN:-http://127.0.0.1:8080}
    volumes:
      - hush-data:/app/var
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Deletes expired, abandoned and burned rows every five minutes.
  gc:
    build: .
    image: hush-zero-knowledge-vault:local
    depends_on:
      hush:
        condition: service_healthy
    entrypoint: ["sh", "-c", "while true; do php /app/bin/hush-admin gc; sleep 300; done"]
    volumes:
      - hush-data:/app/var
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  hush-data:

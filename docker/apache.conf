ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
    DocumentRoot /app/public

    <Directory /app/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        # Every path that is not a file in public/ goes to the front controller.
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Deliberately no CustomLog: the vault keeps no access log, so neither
    # client addresses nor secret ids are written to disk by the web server.
</VirtualHost>

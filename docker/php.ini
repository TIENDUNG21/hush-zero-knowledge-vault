expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 128M
; Chunks arrive as PUT (not subject to this); only the small JSON create is a POST.
post_max_size = 2M
file_uploads = Off
max_execution_time = 60
allow_url_include = Off
opcache.enable = 1
opcache.validate_timestamps = 0
